name: 24/7 AI MT5 Trade Scanner

on:
  schedule:
    # Run every 30 minutes Monday through Friday (Forex active sessions)
    - cron: '*/30 * * * 1-5'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub UI or Phone

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  trade-scan:
    name: Run AI Market Scan & Execute
    runs-on: windows-latest
    steps:
      - name: Checkout Code & Models
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download & Install MetaTrader 5
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        shell: powershell
        run: |
          Write-Host "Downloading Elefin MetaTrader 5 setup..."
          $setupUrl = "https://download.terminal.free/cdn/web/elefin.ltd/mt5/elefin5setup.exe"
          Invoke-WebRequest -Uri $setupUrl -OutFile "elefin5setup.exe"
          
          Write-Host "Installing MetaTrader 5 silently..."
          Start-Process -FilePath ".\elefin5setup.exe" -ArgumentList "/auto" -Wait
          Write-Host "MetaTrader 5 installation complete."
          
          $termPath = "C:\Program Files\Elefin MT5 Terminal\terminal64.exe"
          if (-not (Test-Path $termPath)) {
            $found = Get-ChildItem -Path "C:\Program Files" -Filter "terminal64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $termPath = $found.FullName }
          }
          Write-Host "Detected MT5 Binary: $termPath"
          
          # Write startup config to automatically log into broker and bypass modal wizard
          $configPath = "C:\mt5_config.ini"
          $lines = @(
            "[Common]",
            "Login=$($env:MT5_LOGIN)",
            "Password=$($env:MT5_PASSWORD)",
            "Server=$($env:MT5_SERVER)"
          )
          $lines | Set-Content -Path $configPath
          Write-Host "MT5 configuration generated at $configPath"
          
          Write-Host "Pre-launching MT5 terminal with broker config..."
          Start-Process -FilePath $termPath -ArgumentList "/config:$configPath"
          Start-Sleep -Seconds 15
          Get-Process -Name "terminal64" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Terminal running with PID: $($_.Id)" }





      - name: Execute Autonomous AI Market Scan
        env:
          PYTHONIOENCODING: "utf-8"
          PYTHONUTF8: "1"
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner_job.py
