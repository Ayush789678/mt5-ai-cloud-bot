name: 24/7 AI MT5 Trade Scanner

on:
  schedule:
    # Run every 30 minutes Monday through Friday (Forex active sessions)
    - cron: '*/30 * * * 1-5'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub UI or Phone

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  trade-scan:
    name: Run AI Market Scan & Execute
    runs-on: windows-latest
    steps:
      - name: Checkout Code & Models
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download & Install MetaTrader 5
        shell: powershell
        run: |
          Write-Host "Downloading Elefin MetaTrader 5 setup..."
          $setupUrl = "https://download.terminal.free/cdn/web/elefin.ltd/mt5/elefin5setup.exe"
          Invoke-WebRequest -Uri $setupUrl -OutFile "elefin5setup.exe"
          
          Write-Host "Installing Elefin MT5 silently..."
          $proc = Start-Process -FilePath ".\elefin5setup.exe" -ArgumentList "/auto" -PassThru
          
          $timeout = 60
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          while ($sw.Elapsed.TotalSeconds -lt $timeout) {
            $found = Get-ChildItem -Path "C:\Program Files" -Filter "terminal64.exe" -Recurse -ErrorAction SilentlyContinue
            if ($found) {
              Write-Host "MT5 Binary detected:"
              Write-Host $found.FullName
              Start-Sleep -Seconds 5
              break
            }
            Start-Sleep -Seconds 2
          }
          
          # Terminate auto-launched GUI so Python IPC can initialize the terminal properly
          Stop-Process -Name "terminal64" -Force -ErrorAction SilentlyContinue
          Stop-Process -Name "elefin5setup" -Force -ErrorAction SilentlyContinue
          
          $allFound = Get-ChildItem -Path "C:\Program Files" -Filter "terminal64.exe" -Recurse -ErrorAction SilentlyContinue
          Write-Host "Final Installed MT5 locations:"
          if ($allFound) {
            $allFound | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "No terminal64.exe found in Program Files yet."
          }




      - name: Execute Autonomous AI Market Scan
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner_job.py
