name: 24/7 AI MT5 Trade Scanner

on:
  schedule:
    # Run every 30 minutes Monday through Friday (Forex active sessions)
    - cron: '*/30 * * * 1-5'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub UI or Phone

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  trade-scan:
    name: Run AI Market Scan & Execute
    runs-on: windows-latest
    steps:
      - name: Checkout Code & Models
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download & Install MetaTrader 5
        shell: powershell
        run: |
          Write-Host "Downloading MetaTrader 5 setup..."
          $url1 = "https://download.terminal.free/cdn/web/elefin.ltd/mt5/elefin5setup.exe"
          $url2 = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          
          try {
            Invoke-WebRequest -Uri $url1 -OutFile "elefin5setup.exe"
            Start-Process -FilePath ".\elefin5setup.exe" -ArgumentList "/auto" -Wait
          } catch {
            Write-Host "Elefin setup download failed, trying standard MT5 setup..."
          }
          
          $found = Get-ChildItem -Path "C:\Program Files" -Filter "terminal64.exe" -Recurse -ErrorAction SilentlyContinue
          if (-not $found) {
            Write-Host "Searching full drive for terminal64.exe or installing official MT5..."
            Invoke-WebRequest -Uri $url2 -OutFile "mt5setup.exe"
            Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/auto" -Wait
            $found = Get-ChildItem -Path "C:\Program Files" -Filter "terminal64.exe" -Recurse -ErrorAction SilentlyContinue
          }
          
          Write-Host "Installed MT5 terminal locations:"
          $found | ForEach-Object { Write-Host "  -> $($_.FullName)" }


      - name: Execute Autonomous AI Market Scan
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner_job.py
